name: Build Windows EXE

# Compila l'eseguibile Windows (.exe) con Electron + electron-builder.
# - Su push di un tag "v*" (es. v0.1.0) pubblica anche una Release con gli .exe.
# - Avviabile manualmente da Actions → "Run workflow".
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build EXE (Vite + electron-builder)
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daggerheart-windows-exe
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (solo sui tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
