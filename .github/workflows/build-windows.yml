name: Build Windows EXE

# Compila l'eseguibile Windows (.exe) con Electron + electron-builder
# e pubblica una Release con gli .exe allegati.
# - Su push di un tag "v*" usa quel tag.
# - Avviabile manualmente da Actions → "Run workflow" (crea/aggiorna la
#   Release con il tag indicato, default v0.1.0).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della Release da creare (es. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build EXE (Vite + electron-builder)
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daggerheart-windows-exe
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Daggerheart Strumenti PG ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
